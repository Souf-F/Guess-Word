
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Guess Word - The Ultimate Word Game</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@300;400;600;700;800;900&family=Playfair+Display:wght@700;900&display=swap" rel="stylesheet">
  <style>
    body {
      background-color: #fffaf0;
      color: #2d3436;
      font-family: 'Montserrat', sans-serif;
      overflow-x: hidden;
      margin: 0;
    }
    .sakura {
      position: absolute;
      background-color: #ffb7c5;
      border-radius: 100% 0 100% 0;
      opacity: 0.7;
      pointer-events: none;
      z-index: 1;
    }
    @keyframes fall {
      0% { transform: translateY(-10vh) translateX(0) rotate(0deg); }
      100% { transform: translateY(110vh) translateX(100px) rotate(360deg); }
    }
    .sakura-anim {
      animation: fall linear infinite;
    }
    ::-webkit-scrollbar {
      width: 6px;
    }
    ::-webkit-scrollbar-track {
      background: #fffaf0;
    }
    ::-webkit-scrollbar-thumb {
      background: #ffb7c5;
      border-radius: 10px;
    }
    .logo-font {
      font-family: 'Playfair Display', serif;
    }
  </style>
  <script type="importmap">
  {
    "imports": {
      "react/": "https://esm.sh/react@^19.2.4/",
      "react": "https://esm.sh/react@^19.2.4",
      "react-dom/": "https://esm.sh/react-dom@^19.2.4/"
    }
  }
  </script>
</head>
<body class="bg-[#fffaf0]">
  <div id="root"></div>
</body>
</html>
